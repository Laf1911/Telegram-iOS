name: Build TelegramMod IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build TelegramMod IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set active Xcode version
        run: |
          set -x
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true

          # Проверяем наличие Xcode 27.1 или старшей доступной версии
          if [ -d "/Applications/Xcode_27.1.app" ]; then
            echo "Selecting Xcode 27.1"
            sudo xcode-select -s "/Applications/Xcode_27.1.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_27.0.app" ]; then
            echo "Selecting Xcode 27.0"
            sudo xcode-select -s "/Applications/Xcode_27.0.app/Contents/Developer"
          else
            # Выбираем самую старшую версию Xcode среди установленных
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LATEST_XCODE" ] && [ -d "$LATEST_XCODE/Contents/Developer" ]; then
              echo "Selecting highest available Xcode: $LATEST_XCODE"
              sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
            fi
          fi

          DEVELOPER_DIR=$(xcode-select -p)
          echo "Active Developer Directory: $DEVELOPER_DIR"
          xcodebuild -version

          # Получаем фактическую версию выбранного Xcode
          ACTUAL_XCODE=$(plutil -p "$DEVELOPER_DIR/../Info.plist" 2>/dev/null | grep CFBundleShortVersionString | awk -F'"' '{print $(NF-1)}' || xcodebuild -version | head -n1 | cut -d' ' -f2)
          echo "Actual Xcode version: $ACTUAL_XCODE"

          # Синхронизируем versions.json с фактической версией Xcode
          if [ -f versions.json ] && [ -n "$ACTUAL_XCODE" ]; then
            python3 -c 'import json, sys; p="versions.json"; f=open(p); d=json.load(f); f.close(); d["xcode"]=sys.argv[1]; d["deploy_xcode"]=sys.argv[1]; f=open(p,"w"); json.dump(d,f,indent=4); f.close()' "$ACTUAL_XCODE"
            cat versions.json
          fi

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            /private/var/tmp/_bazel_containerhost
          key: ${{ runner.os }}-bazel-${{ hashFiles('versions.json', '**/BUILD', 'WORKSPACE', 'MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Prepare build environment
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo chown -R $(whoami) /Users/Shared
          ln -sfn "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Compile and Build App with Fake Codesigning
        run: |
          set -e
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET=0
          if [ -f build_number_offset ]; then
            BUILD_NUMBER_OFFSET=$(cat build_number_offset)
          fi

          APP_VERSION="11.0.0"
          if [ -f versions.json ]; then
            APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj.get("app", "11.0.0"));')
          fi

          COMMIT_COUNT=$(git rev-list --count HEAD || echo "1")
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          echo "Building Telegram version $APP_VERSION ($BUILD_NUMBER)..."

          # Импорт самоподписанных сертификатов для сборки без платного аккаунта Apple Developer
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # Обновление срока действия ExpirationDate и переподписание фейковых профилей через security cms
          security set-keychain-settings temp.keychain
          security unlock-keychain -p secret temp.keychain
          security set-key-partition-list -S apple-tool:,apple: -k secret temp.keychain || true

          SIGNING_IDENTITY="Apple Distribution: Telegram FZ-LLC (C67CF9S4VU)"
          echo "Signing updated profiles with identity: $SIGNING_IDENTITY"

          for PROFILE in build-system/fake-codesigning/profiles/*.mobileprovision; do
            if [ -f "$PROFILE" ]; then
              echo "Resigning $PROFILE..."
              TMP_PLIST=$(mktemp)
              security cms -D -i "$PROFILE" > "$TMP_PLIST"
              python3 -c 'import sys; p = sys.argv[1]; c = open(p, "r").read(); c = c.replace("2026-10-30", "2028-10-30"); open(p, "w").write(c)' "$TMP_PLIST"
              security cms -S -k temp.keychain -N "$SIGNING_IDENTITY" -i "$TMP_PLIST" -o "$PROFILE"
              rm -f "$TMP_PLIST"
              openssl smime -inform der -verify -noverify -in "$PROFILE" > /dev/null
              echo "Verified $PROFILE: OK"
            fi
          done

          # Сборка с флагом CODE_SIGNING_ALLOWED=NO и конфигурацией fake-codesigning
          export CODE_SIGNING_ALLOWED=NO
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # Упаковка в TelegramMod.ipa
          mkdir -p build/artifacts
          FOUND_IPA=$(find bazel-out -name "Telegram.ipa" -print -quit)
          if [ -n "$FOUND_IPA" ]; then
            echo "Found Telegram.ipa at $FOUND_IPA"
            cp "$FOUND_IPA" "$GITHUB_WORKSPACE/TelegramMod.ipa"
          else
            echo "Searching for Telegram.app..."
            APP_DIR=$(find bazel-out -name "Telegram.app" -type d -print -quit)
            if [ -n "$APP_DIR" ]; then
              echo "Found Telegram.app at $APP_DIR. Packaging into Payload..."
              mkdir -p Payload
              cp -R "$APP_DIR" Payload/
              zip -qr "$GITHUB_WORKSPACE/TelegramMod.ipa" Payload
            else
              echo "Warning: Neither Telegram.ipa nor Telegram.app found, checking bazel-bin..."
              if [ -d bazel-bin/Telegram/Telegram.app ]; then
                mkdir -p Payload
                cp -R bazel-bin/Telegram/Telegram.app Payload/
                zip -qr "$GITHUB_WORKSPACE/TelegramMod.ipa" Payload
              fi
            fi
          fi

      - name: Verify IPA
        run: |
          if [ -f "$GITHUB_WORKSPACE/TelegramMod.ipa" ]; then
            echo "TelegramMod.ipa generated successfully:"
            ls -lh "$GITHUB_WORKSPACE/TelegramMod.ipa"
          else
            echo "Error: TelegramMod.ipa was not created."
            exit 1
          fi

      - name: Upload TelegramMod IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMod
          path: TelegramMod.ipa
          if-no-files-found: error
